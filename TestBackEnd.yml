# ASP.NET Core (.NET Framework)
# Build and test ASP.NET Core projects targeting the full .NET Framework.
# Add steps that publish symbols, save build artifacts, and more:
# https://docs.microsoft.com/azure/devops/pipelines/languages/dotnet-core

trigger:
- main

pool:
  vmImage: 'windows-latest'

variables:
  solution: '**/*.sln'
  buildPlatform: 'Any CPU'
  buildConfiguration: 'Release'

steps:
- task: NuGetToolInstaller@1

- task: NuGetCommand@2
  inputs:
    restoreSolution: '$(solution)'

- task: DotNetCoreCLI@2
  displayName: Run Unit Tests
  inputs:
    command: test
    publishTestResults: false
    projects: '$(solution)'
    arguments: '--no-restore --logger trx --results-directory $(TestResultsPath) --collect:"XPlat Code Coverage" --settings ./MonitoringBackEnd/coverlet.runsettings'

- task: PublishTestResults@2
  displayName: Publish Unit Test Results
  inputs:
    testResultsFormat: VSTest
    testResultsFiles: '**/*.trx'
    searchFolder: $(TestResultsPath)

- task: PublishCodeCoverageResults@2
  displayName: Publish Code Coverage Results
  inputs:
    summaryFileLocation: $(TestResultsPath)/**/coverage.cobertura.xml