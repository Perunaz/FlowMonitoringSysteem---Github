version: '3.8'
services:
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: rabbitmq
    volumes:
      - rabbitmqdata:/var/lib/rabbitmq
      - "./rabbitmq:/etc/FlowMonitoringSysteem/"
    ports:
      - "15672:15672"
      - "5672:5672"
    environment:
      - RABBITMQ_CONFIG_FILE=./Rabbitmq/rabbitmq.conf

  influxdb:
    image: influxdb:latest
    container_name: influxdb
    ports:
      - "8086:8086"
    volumes:
      - ./influxdb_data:/var/lib/influxdb
    environment:
      - INFLUXDB_DB=${INFLUXDB_DB_NAME}
      - INFLUXDB_ADMIN_USER=${INFLUXDB_ADMIN_USER}
      - INFLUXDB_ADMIN_PASSWORD=${INFLUXDB_ADMIN_PASSWORD}
      - INFLUXDB_USER=${INFLUXDB_USER}
      - INFLUXDB_USER_PASSWORD=${INFLUXDB_USER_PASSWORD}
      - INFLUXDB_LOGGING_LEVEL=debug

  notficationservice:
    build:
      context: ./NotificationService
      dockerfile: Dockerfile
    container_name: notificationservice
    depends_on:
      - rabbitmq
    ports:
      - "3100:3100"
    environment:
      - NODE_ENV=development
      - HTTPS=true
      - SSL_CRT_FILE=/opt/project/ssl/cert.pem
      - SSL_KEY_FILE=/opt/project/ssl/key.pem
    
  teamsapp:
    build:
      context: ./TeamsApp
      dockerfile: Dockerfile
    container_name: teamsapp
    depends_on:
      - rabbitmq
    ports:
      - "53000:53000"
    environment:
      - NODE_ENV=development
      - HTTPS=true
      - PORT=53000
      - TEAMS_APP_ID=4a224ec0-9d8b-4f61-8eb3-da737a4c367f
      - REACT_APP_CLIENT_ID=ff3dd1f0-b9f6-45b1-8da2-dca9012c6795
      - REACT_APP_START_LOGIN_PAGE_URL=https://localhost:53000/auth-start.html
      - REACT_APP_FUNC_NAME=callGraph
      - REACT_APP_FUNC_ENDPOINT=http://localhost:7071
      - export SSL_CRT_FILE=${TEAMS_SSL_CRT_FILE}
      - export SSL_KEY_FILE=${TEAMS_SSL_KEY_FILE}
    volumes:
    - ~/.fx/certificate:/certificate:ro

  backend:
    build:
      context: ./MonitoringBackEnd
      dockerfile: Dockerfile
    container_name: backend
    depends_on:
      - rabbitmq
      - influxdb
    ports:
      - "5262:5262"
      - "7212:7212"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=https://+:7212;http://+:5262
      - ASPNETCORE_Kestrel__Certificates__Default__Password=${CERTIFICATE_PASSWORD}
      - ASPNETCORE_Kestrel__Certificates__Default__Path=/https/aspnetapp.pfx
    volumes:
      - ~/.aspnet/https:/https:ro

volumes:
  rabbitmqdata:
  influxdb_data: